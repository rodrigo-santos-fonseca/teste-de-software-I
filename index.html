<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Testes de Software</title>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-color: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 600px;
        padding: 2rem;
      }

      .card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        box-shadow:
          0 4px 6px -1px rgb(0 0 0 / 0.1),
          0 2px 4px -2px rgb(0 0 0 / 0.1);
        padding: 2.5rem;
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 1.75rem;
        color: var(--text-color);
        margin-bottom: 0.5rem;
      }

      p.subtitle {
        color: var(--text-muted);
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .nav-links {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .nav-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #f1f5f9;
        border: 1px solid var(--border-color);
        padding: 1rem 1.25rem;
        border-radius: 8px;
        text-decoration: none;
        color: var(--text-color);
        font-weight: 600;
        transition: all 0.2s ease;
      }

      .nav-item:hover {
        background-color: var(--primary-color);
        color: #ffffff;
        border-color: var(--primary-color);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }

      .nav-item span {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .badge {
        background-color: rgba(0, 0, 0, 0.06);
        padding: 0.25rem 0.6rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 500;
      }

      .nav-item:hover .badge {
        background-color: rgba(255, 255, 255, 0.2);
        color: #ffffff;
      }

      footer {
        margin-top: 2rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Ambiente de Testes</h1>
        <p class="subtitle">
          Selecione o módulo de teste de software abaixo para navegar:
        </p>

        <div class="nav-links">
          <a href="teste1.html" class="nav-item">
            <span>
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
                />
              </svg>
              Validação de Formulário
            </span>
            <span class="badge">Módulo 1</span>
          </a>

          <a href="teste2.html" class="nav-item">
            <span>
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
                />
              </svg>
              Função de Cálculo no Console
            </span>
            <span class="badge">Módulo 2</span>
          </a>

          <a href="teste3.html" class="nav-item">
            <span>
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
                />
              </svg>
              Teste de Interface (CSS)
            </span>
            <span class="badge">Módulo 3</span>
          </a>
        </div>
      </div>

      <footer>Navegador local de arquivos</footer>
    </div>
  </body>
</html>
